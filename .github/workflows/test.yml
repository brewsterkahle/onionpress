name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    # Pinned rather than ubuntu-latest, which becomes Ubuntu 26 from
    # 2026-10-19: move every workflow together, after a green run there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # PyNaCl (libsodium) encrypts backups (backup format 2): the Mac bundle
      # ships the latest release, the Linux package depends on python3-nacl.
      # coverage measures the run (.coveragerc: branches, what ships).
      - name: Install test dependencies
        run: python -m pip install "pynacl>=1.5.0" coverage

      # The whole suite, measured. A failing test fails here; the floors
      # (the total and the files whose logic the tests exist for) are the
      # next step's, so a coverage drop reads as its own failure.
      - name: Run all tests under coverage
        run: >
          python -m coverage run --branch
          --source=src/onionpress,linux,app/Resources/docker/tor
          -m unittest discover tests -p "test_*.py" -v

      - name: Coverage report
        run: python -m coverage report --skip-empty

      # build/coverage-floors.sh: the total and per-file floors, each a
      # point or two under the measured value. Raise one when the tests
      # catch up; never lower one to pass.
      - name: Coverage floors
        run: ./build/coverage-floors.sh

      - name: Coverage files
        if: always()
        run: |
          python -m coverage xml
          python -m coverage html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            build/coverage.xml
            build/coverage-html/
          if-no-files-found: ignore

      # 1.5.0 is the python3-nacl of Debian 12/13 and Ubuntu 22.04/24.04,
      # what Linux installs run: the backup tests again against it.
      - name: Backup tests against PyNaCl 1.5.0
        run: |
          python -m pip install "pynacl==1.5.0"
          python -m unittest tests.test_backup_manager tests.test_backup_metadata_validation tests.test_hub_backup_sealed
