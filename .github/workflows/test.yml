name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    # Pinned rather than ubuntu-latest, which becomes Ubuntu 26 from
    # 2026-10-19: move every workflow together, after a green run there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # PyNaCl (libsodium) encrypts backups (backup format 2): the Mac bundle
      # ships the latest release, the Linux package depends on python3-nacl.
      # coverage measures the run (.coveragerc: branches, what ships).
      - name: Install test dependencies
        run: python -m pip install "pynacl>=1.5.0" coverage pyyaml

      # The whole suite, measured. A failing test fails here; the floors
      # (the total and the files whose logic the tests exist for) are the
      # next step's, so a coverage drop reads as its own failure.
      - name: Run all tests under coverage
        run: >
          python -m coverage run --branch
          --source=src/onionpress,linux,app/Resources/docker/tor
          -m unittest discover tests -p "test_*.py" -v

      - name: Coverage report
        run: python -m coverage report --skip-empty

      # build/coverage-floors.sh: the total and per-file floors, each a
      # point or two under the measured value. Raise one when the tests
      # catch up; never lower one to pass.
      - name: Coverage floors
        run: ./build/coverage-floors.sh

      - name: Coverage files
        if: always()
        run: |
          python -m coverage xml
          python -m coverage html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build/coverage.xml
            build/coverage-html/
          if-no-files-found: ignore

      # 1.5.0 is the python3-nacl of Debian 12/13 and Ubuntu 22.04/24.04,
      # what Linux installs run: the backup tests again against it.
      - name: Backup tests against PyNaCl 1.5.0
        run: |
          python -m pip install "pynacl==1.5.0" pyyaml
          python -m unittest tests.test_backup_manager tests.test_backup_metadata_validation tests.test_hub_backup_sealed

  macos-tests:
    name: Python unit tests (macOS)
    # The Mac is what ships: the Darwin-only tests (sips/iconutil for the
    # generated assets, BSD sed in the address-prefix tests) run only here,
    # and the bash harnesses run under /bin/bash 3.2, the shell the
    # launchers and build scripts get on a user's Mac (CI's Linux job runs
    # them under bash 5). macOS runner minutes cost ten times Linux's, so
    # this job runs on pull requests only; the Linux job stays the
    # required check on every push and PR.
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install "pynacl>=1.5.0" pyyaml

      # Both launchers must parse under the Mac's own /bin/bash (3.2).
      - name: Launchers parse under /bin/bash 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash -n app/MacOS/onionpress
          /bin/bash -n app/MacOS/launcher.sh
          /bin/bash -n linux/onionpress

      # The PHP harnesses (mu-plugin tests) skip without php; the macOS
      # runner image does not carry one, and the Linux job runs them.
      - name: PHP
        run: |
          command -v php && php --version | head -1 || echo "php absent: the PHP-harness tests skip here (the Linux job runs them)"

      # DOCKER_HOST points at nothing: the docker-backed tests skip
      # instead of reaching a daemon (a developer's Mac runs the live
      # site; the runner has no Docker at all).
      - name: Run all tests
        env:
          DOCKER_HOST: unix:///var/empty/no-docker-for-tests.sock
        run: python -m unittest discover tests -p "test_*.py"
