# OnionPress, system Docker: put the WordPress network's egress rules in
# place before dockerd restarts any container (issue #144; see
# docs/DOCKER-SOCKET.md, "WordPress's network"). The launcher puts them in
# place on every start too, but Docker restarts the containers at boot
# before the user's service runs. The "-" keeps a failure from stopping
# Docker. Under rootless Docker it changes nothing: the bridge it names is
# in RootlessKit's namespace, where the launcher puts the rules itself.
[Service]
ExecStartPre=-/opt/onionpress/onionpress-wordpress-egress apply onionpress-wp0 ONIONPRESS-WP
