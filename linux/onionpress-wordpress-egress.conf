# OnionPress, system Docker: put the containers' rules in place before
# dockerd restarts any container (issue #144; see docs/DOCKER-SOCKET.md,
# "WordPress's network"): WordPress's network (onionpress-wp0) and the Tor
# side's (onionpress-tor0). The launcher puts them in place on every start
# too, with the published-port rule (it knows the port; this file does not,
# and leaves that rule as it is), but Docker restarts the containers at boot
# before the user's service runs. The "-" keeps a failure from stopping
# Docker. Under rootless Docker it changes nothing: the bridges it names are
# in RootlessKit's namespace, where the launcher puts the rules itself.
[Service]
ExecStartPre=-/opt/onionpress/onionpress-wordpress-egress apply onionpress-wp0 ONIONPRESS-WP onionpress-tor0 ONIONPRESS-TOR
