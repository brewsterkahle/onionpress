# My Creations is a publishing folder, never code.
#
# docker-compose.yml bind-mounts the host folder ~/OnionPress/Creations/
# My Creations here, under DocumentRoot, so anything in it is reachable at
# /wp-content/creations/... — and the base image hands every *.php under
# DocumentRoot to PHP. Files land here from the owner's Finder and from the
# Creations upload form (Author and up), so a .php in this folder must be
# served as a file or not at all, never run as www-data.
#
# The Creations page serves files through WordPress (?onionpress_creation=,
# readfile()), not from this path, so none of this affects it. The same
# extensions are refused at upload (onionpress-creations.php) and by the
# multisite .htaccess (src/onionpress/multisite.py), which reaches installs
# before this image does.
<Directory /var/www/html/wp-content/creations>
    # Not `None`: the multisite .htaccess RewriteRules need a symlink option
    # in every directory they run in, or Apache answers 403 for every file
    # here. IfOwnerMatch follows a link only when it and its target share an
    # owner, so a symlink in the folder cannot publish a container file.
    Options SymLinksIfOwnerMatch
    # A .htaccess dropped into the folder could map any extension back to PHP.
    AllowOverride None
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "(?i)\.(php[0-9]*|pht(ml)?|phar|phps|cgi|shtml)$">
        Require all denied
    </FilesMatch>
    # .DS_Store and the like: Finder metadata, not publications.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

# Nor anything inside a hidden folder (.git/, .thumbs/, the blog importer's
# .blog-archives/ snapshots): FilesMatch sees only a file's own name.
<DirectoryMatch "^/var/www/html/wp-content/creations/(.+/)?\.">
    Require all denied
</DirectoryMatch>
# The blog importer kept those snapshots (drafts, private posts, author
# emails) in blog-archives/ through 2.5.2 and moves that folder into
# .blog-archives/; until it has, the old folder is refused as well.
<DirectoryMatch "(?i)^/var/www/html/wp-content/creations/blog-archives(/|$)">
    Require all denied
</DirectoryMatch>
