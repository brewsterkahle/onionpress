# WordPress's installer is the owner's alone (issue #464).
#
# Until WordPress is installed, wp-admin/install.php takes the first
# visitor's choice of admin account (user 1, super admin after the multisite
# conversion), and setup-config.php writes wp-config.php. Both are reached
# over Tor as soon as the onion service is up, days before a headless
# install's owner runs `onionpress setup`. Only the owner's own requests
# may see them: from loopback, or from this container's default gateway,
# which is where the published port's requests arrive from (docker-proxy
# on Linux, Lima's forward on a Mac; the same rule as auto-login's "local"
# scope). Tor visitors arrive from the tor container, cloudflared's from
# its own address: neither is the gateway. The entrypoint exports
# ONIONPRESS_WP_GATEWAY from the routing table before Apache starts; with
# none, loopback only. The rule stays after setup: nothing outside needs
# the installer.
<Files ~ "^(install|setup-config)\.php$">
    Require ip 127.0.0.0/8 ::1
    Require expr %{REMOTE_ADDR} == osenv('ONIONPRESS_WP_GATEWAY')
</Files>
