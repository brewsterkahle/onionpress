# Static target for the app's Tor-network reachability probe (issue #266).
#
# The menubar / Linux service curls http://<address>.onion/.onionpress-health
# through two independent Tor clients every poll cycle. Apache serves this
# file straight from the image — no PHP, no database — so a slow WordPress
# cannot exhaust the probe's curl budget on a healthy Tor path and register
# as rc=28, the same code dead intro points produce. The body carries the
# "onionpress-health" marker the probe checks (src/onionpress/health.py
# PROBE_BODY_MARKER / PROBE_PATH). Older images without this conf answer
# 404 and the probe falls back to "/".
Alias /.onionpress-health /usr/local/share/onionpress/health.txt
<Directory /usr/local/share/onionpress>
    Options None
    AllowOverride None
    Require all granted
</Directory>
<Location /.onionpress-health>
    Header set Cache-Control "no-store"
</Location>
