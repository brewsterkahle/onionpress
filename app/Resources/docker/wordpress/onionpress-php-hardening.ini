; PHP2Shell (CVE-2026-109619): the confirmed exploit paths for the stale
; global state run through session upload progress, which PHP turns on by
; default. WordPress does not use PHP sessions, so nothing here needs it.
; It has to be set here, before request parsing: ini_set() and .user.ini
; come too late. The fix itself is PHP 8.3.36; the Dockerfile refuses an
; older base.
session.upload_progress.enabled = 0
