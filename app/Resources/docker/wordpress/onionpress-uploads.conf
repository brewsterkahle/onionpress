# WordPress uploads are media, never code.
#
# wp-content/uploads (and uploads/sites/<n>/ for the other sites) sits under
# DocumentRoot, and the base image hands every *.php under DocumentRoot to
# PHP. WordPress's own upload paths refuse PHP by MIME type, but that is the
# only thing between a file that lands here and running it as www-data:
# importers, plugins and restored backups all write here too. Nothing
# legitimate is ever requested as a script from this folder, so a .php here
# is refused, and PHP is off for it either way.
#
# This mirrors onionpress-creations.conf with one difference: .htaccess
# files stay allowed. Plugins protect private folders under uploads with
# one (WooCommerce's downloadable products, form uploads); with
# AllowOverride None their deny rules would be ignored and those files
# served to anyone. php_admin_flag cannot be undone from a .htaccess.
#
# The same extensions are refused by the multisite .htaccess
# (src/onionpress/multisite.py), which reaches installs before this image
# does (tests/test_uploads_no_php.py).
<Directory /var/www/html/wp-content/uploads>
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "(?i)\.(php[0-9]*|pht(ml)?|phar|phps|cgi|shtml)$">
        Require all denied
    </FilesMatch>
</Directory>
