; Allow large file uploads for My Creations
upload_max_filesize = 2G
post_max_size = 2G
max_execution_time = 300
max_input_time = 300
; PHP keeps only the first max_file_uploads files of a request (default 20)
; and drops the rest silently; My Creations takes whole folders of photos.
max_file_uploads = 200
