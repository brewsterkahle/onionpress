; Allow large file uploads for My Creations
upload_max_filesize = 2G
post_max_size = 2G
max_execution_time = 300
max_input_time = 300

; The static-site generation upload (POST /wp-json/onionpress/v1/generation)
; is multipart-only as of receiver_version 2.0: rfc1867.c streams the part
; to upload_tmp_dir, so no memory_limit raise is needed for it. The 512M
; that used to live here existed solely for the removed raw-body carrier,
; which WP's REST server buffered into a PHP string before the route could
; reject it.
