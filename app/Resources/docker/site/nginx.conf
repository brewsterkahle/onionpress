worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
        application/xml text/xml image/svg+xml;

    # No access log — content is served over an onion service; visitor
    # activity isn't logged anywhere else in OnionPress either.
    access_log off;
    error_log /dev/stderr warn;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # No directory listing — an empty/missing index.html should 404,
        # not enumerate the publish directory's contents.
        autoindex off;

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }
    }
}
