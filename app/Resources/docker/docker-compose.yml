# Every service drops every capability, adds back only the ones it was seen
# to need, and runs with no-new-privileges. So do the takeover workers the
# farm controller starts for the onionheaven container (onionheaven-farm.py's
# worker_run_argv) and every one-shot `docker run` in the launchers. tests/test_container_capabilities.py
# enforces it, with each service's and each `docker run`'s cap_add held to
# an allowlist in the test.
#
# Each set was found on the 2.5.3 images by starting the service with no
# capability and adding one at a time until start-up, the healthcheck, the
# service's real work and the host's `docker exec` into it (which runs with
# the same set) all worked; the comment at each service says which step
# needs which. Of Docker's defaults, none here needs AUDIT_WRITE (su and
# runuser switch users without it), FSETID, MKNOD, NET_RAW, SETFCAP, SETPCAP
# or SYS_CHROOT, and only WordPress needs KILL or NET_BIND_SERVICE. Root in
# these containers reads and writes other users' files with DAC_OVERRIDE.
# DAC_READ_SEARCH, which could do the reading, never: with it,
# open_by_handle_at() opens any file on a mounted filesystem by inode
# number, the "shocker" escape from a container to the whole volume or host
# filesystem.
#
# NET_RAW: auto-login's "local" scope and /__op_proxy.php admit loopback and
# the gateway of WordPress's network (onionpress-wordpress-network) by
# source address. With NET_RAW, root in any container on that network (the
# onion-facing tor container, WordPress)
# could ARP-spoof the gateway or forge its packets. Without it, and without
# NET_ADMIN (Docker does not grant it and no service adds it), a container
# sends from its own address only: IP_FREEBIND can name another source, but
# the replies go to that address's real owner, so no TCP connection
# completes from it. Nothing here needs raw sockets: no ping anywhere, and
# tor, socat, nc, curl, Apache, MariaDB, cloudflared and autoheal speak TCP,
# UDP and unix sockets.
#
# no-new-privileges: no setuid or file-capability binary raises a process
# above what it started with. Every privilege drop here is root calling
# setuid() itself, which it leaves alone: the tor image's entrypoint runs
# `su` as root, MariaDB's entrypoint uses gosu (not setuid), Apache's root
# parent drops its children to www-data. What it stops is a compromised
# debian-tor, www-data or mysql process climbing back to root through su,
# mount, passwd or any other setuid binary in an image.
#
# autoheal, autoheal-proxy, onionheaven-farm and cloudflared add nothing
# back; none of them uses a capability (see each).
services:
  tor:
    image: ${ONIONPRESS_TOR_IMAGE:-ghcr.io/brewsterkahle/onionpress-tor:latest@sha256:7035842f4aab419948febd7f64c287f937e0a2cb2bbd5ec1a32d42269081d7e7}
    container_name: onionpress-tor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    environment:
      - TZ=${TZ:-UTC}
      - ONIONPRESS_VERSION=${ONIONPRESS_VERSION:-unknown}
      # Only the OnionHeaven hub accepts registrations; "yes" opts another
      # node in (ONIONHEAVEN_ACCEPT_REGISTRATIONS in ~/.onionpress/config).
      - ONIONHEAVEN_ACCEPT_REGISTRATIONS=${ONIONHEAVEN_ACCEPT_REGISTRATIONS:-}
    volumes:
      # onion-keys holds the site's identity: the launchers deliver the onion
      # service key here as a PEM (<name>/ks_hs_id.ed25519_expanded_private)
      # and the entrypoint converts it to C Tor's key files. Until 2026-09-25
      # this was onionpress-arti-state; the launchers migrate it on first start.
      - onion-keys:/var/lib/onionpress-keys/
      - tor-state:/var/lib/tor/
      - onionpress-data:/var/lib/onionpress
      # OnionHeaven registry and registrants' keys (see the volume below).
      - onionheaven-data:/var/lib/onionheaven
      # OnionHome's name registry (see the volume below); this service only.
      - onionnames-data:/var/lib/onionnames
      - ${ONIONPRESS_SHARED_DIR:-/tmp/onionpress-no-shared}/analytics:/var/lib/onionhome/analytics
    # No Docker socket here. This container serves the onion services and
    # the OnionHeaven API to anyone on Tor; the socket is root on the Docker
    # host (the user's own daemon under rootless Docker). Its OnionHeaven
    # code hands everything that needs Docker to the onionheaven service
    # through the registry (see docs/DOCKER-SOCKET.md).
    depends_on:
      - wordpress
    restart: unless-stopped
    # The entrypoint (root) makes the key folders and writes the converted
    # key and the version file in /var/lib/tor, debian-tor's 0700 folder,
    # and the two migrations read and clear the old locations in
    # /var/lib/onionpress, www-data's 0750 folder (DAC_OVERRIDE; without it
    # the first mkdir fails and the key conversion refuses to start). It
    # gives /var/lib/tor back to debian-tor (CHOWN; without it Tor cannot
    # open its root-made tor.log and exits), sets the key folders to 0700
    # (FOWNER; without it they stay 0755) and starts Tor with su (SETGID,
    # SETUID). The watchdog (root) reads the control cookie and saves
    # generated keys there, and the host's `docker exec cat` reads the
    # hostname and key files (DAC_OVERRIDE). Nothing in it signals another
    # user's process or binds below 1024.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - onionpress-network
      - wordpress-network
    # onionpress-network is the way out (Tor relays); wordpress-network is
    # how socat reaches wordpress:80 and WordPress reaches 9050 and 8083
    # here. See the networks below.
    #
    # Tor's SOCKS port is for this machine only, on every platform: it is
    # deliberately not ONIONPRESS_BIND_HOST (which only decides WordPress's
    # reach), and not configurable. Long syntax on purpose: older Linux
    # launchers' `onionpress update` carries a sed that rewrites
    # "127.0.0.1:${ONIONPRESS_SOCKS_PORT" to 0.0.0.0, and this form gives it
    # nothing to match.
    ports:
      - target: 9050
        published: "${ONIONPRESS_SOCKS_PORT:-9050}"
        host_ip: 127.0.0.1
        protocol: tcp

  wordpress:
    image: ${ONIONPRESS_WORDPRESS_IMAGE:-ghcr.io/brewsterkahle/onionpress-wordpress:latest@sha256:5b26f8a3ef70fa02322666af143750bfafd7b98acfd6e89386ae3aeac0df054c}
    container_name: onionpress-wordpress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_DB_NAME=wordpress
      # Only request-derived constants belong here (they need $_SERVER). Static
      # constants live in wp-config.php's custom-values block — keeping both in
      # sync would cause duplicate-define warnings on every request.
      - WORDPRESS_CONFIG_EXTRA=
          $$scheme = 'http';
          if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') $$scheme = 'https';
          define('WP_HOME', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
          define('WP_SITEURL', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
          define('FORCE_SSL_ADMIN', false);
          define('COOKIE_DOMAIN', preg_replace('/:\d+$$/', '', $$_SERVER['HTTP_HOST']));
    # Healthcheck + autoheal label: if Apache wedges (the 2026-04-23 incident
    # pattern — worker pool saturated, requests queuing past timeout), the
    # autoheal sidecar restarts this container automatically. /wp-login.php
    # is a lightweight, always-available endpoint; the previous /wp-cron.php
    # could itself be slow under load.
    #
    # Tuning is deliberately conservative: OnionPress runs on laptops that
    # sleep/wake, so short-lived unreachability after resume is normal.
    # 60s interval × 15 retries ≈ 15 min of sustained failure before restart.
    # The 2026-04-23 outage was 3h45m; 15-min self-heal is a huge improvement
    # without misfiring on wake transients.
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "10", "http://localhost/wp-login.php"]
      interval: 60s
      timeout: 15s
      retries: 15
      start_period: 300s
    labels:
      - autoheal=true
    # Never onionheaven-data: WordPress is the code visitors reach, and that
    # volume holds other people's onion service keys. Never onionnames-data
    # either (which name points at which onion address): WordPress looks
    # names up through the tor container's API.
    volumes:
      - wordpress-data:/var/www/html
      - onionpress-data:/var/lib/onionpress
      - ${ONIONPRESS_DOCUMENTS_DIR:-/tmp/onionpress-no-docs}/Creations/My Creations:/var/www/html/wp-content/creations:rw
    depends_on:
      - db
    restart: unless-stopped
    # The image's entrypoint (root) unpacks WordPress into the volume as
    # www-data's (CHOWN; tar then sets each file's mode and time, which
    # takes FOWNER once the file is www-data's: without it files stay 0600)
    # and Apache's root parent drops its children to www-data (SETGID,
    # SETUID; also runuser for wp-cli). Root's work in www-data's folders —
    # the security audit's report and quarantine in /var/lib/onionpress
    # (0750), web-root-owner.sh, and the host's fix_onionpress_permissions
    # and wp_files.own — takes DAC_OVERRIDE besides. KILL: Apache's parent
    # signals its www-data children on a graceful restart; without it the
    # old generation keeps serving. NET_BIND_SERVICE: Apache binds :80. Docker
    # 20.10 and later set ip_unprivileged_port_start=0 in the container, so
    # it is only needed on older Docker (Linux distribution packages), where
    # Apache otherwise stops with "could not bind to address 0.0.0.0:80".
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - wordpress-network
    # This network only, and nothing leaves it but replies to connections
    # made from outside (see the networks below). Its gateway is where the
    # published port's connections come from: the address auto-login and
    # /__op_proxy.php admit, which WordPress reads off its default route.
    #
    # No DNS outside Docker. Docker's resolver (127.0.0.11) still answers for
    # the containers (db, onionpress-tor, onionheaven); any other name it
    # forwards to this server instead of the host's, and a --dns loopback
    # address is the container's own loopback, where nothing listens: the
    # lookup fails at once and nothing leaves the machine. Everything this
    # container fetches goes through Tor's SOCKS port by name (socks5h), so
    # Tor resolves it at the exit; a lookup here would be a clearnet DNS query
    # naming the site, from the publisher's network.
    dns:
      - 127.0.0.1
    # macOS never sets ONIONPRESS_BIND_HOST. The Linux launcher does: 0.0.0.0
    # by default so a headless Pi can be set up from another device on the
    # LAN, or 127.0.0.1 when ~/.onionpress/config says so.
    #
    # No container comes in this way. Docker skips its DNAT for anything
    # from one of its bridges, and docker-proxy would hand a container's
    # connection to <host address>:<this port> to WordPress from the
    # gateway; the launchers refuse this port on the Docker host from
    # anything but loopback (onionpress/wordpress_egress.py). LAN visitors
    # are DNAT'd (their own address), the publisher's browser is loopback.
    ports:
      - "${ONIONPRESS_BIND_HOST:-127.0.0.1}:${ONIONPRESS_WP_PORT:-8080}:80"

  db:
    image: mariadb:13.0.2@sha256:f1bba652ba57bea3099ca2fe1af692af537c27d96e0bcde39dce29e2ba1ec4f3
    container_name: onionpress-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    # The official entrypoint (root) walks the data folder, whose database
    # folders are mysql's and 0700, before it switches to mysql with gosu
    # (DAC_OVERRIDE; without it the walk fails on a restart and the entrypoint
    # stops; SETGID, SETUID). The same walk gives any file not mysql's back
    # to mysql (CHOWN): without it one such file means a restart loop, and
    # this image floats, so its own ownership repair has to keep working.
    # First start, restarts and MARIADB_AUTO_UPGRADE run with just these.
    # The host's dumps and imports are clients over the socket; a restore's
    # import streams the dump into the client on stdin (no docker cp of a
    # file into the container), the client run --sandbox so a crafted dump
    # runs only SQL (see CLAUDE.md "Restores Extract Plain Files Only").
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - wordpress-network
    # No DNS outside Docker, as for wordpress above: MariaDB has nothing to
    # look up beyond the containers.
    dns:
      - 127.0.0.1

  # Auto-restart any container labeled autoheal=true when its HEALTHCHECK
  # reports unhealthy. Prevents wedge-until-manual-reboot scenarios like
  # the 2026-04-23 incident. Polling interval is 60s so autoheal itself
  # doesn't thrash; the actual decision to restart is governed by the
  # target container's healthcheck retries (conservative — see wordpress
  # service above for the ~15-minute sustained-failure threshold).
  #
  # autoheal never sees the Docker socket. It talks to autoheal-proxy below
  # over a unix socket on a volume only these two services mount, and has
  # no network at all (no WEBHOOK_URL/APPRISE_URL is configured).
  autoheal:
    image: willfarrell/autoheal:latest@sha256:fe88c69806c71ac82fd3a483596011742f5ef319f84744cc3128e5b92b10af77
    container_name: onionpress-autoheal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=0
      - DOCKER_SOCK=/run/autoheal-proxy/docker.sock
    volumes:
      - autoheal-proxy:/run/autoheal-proxy
    network_mode: none
    # No capability at all: a shell script running curl and jq as root, with
    # no network, writing no files and switching no user. Its one resource
    # is autoheal-proxy's socket, which the proxy (also uid 0) creates mode
    # 0600: the owner's own permission, not DAC_OVERRIDE. The image's
    # HEALTHCHECK (pgrep) reads /proc, which needs none either.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - autoheal-proxy
    restart: unless-stopped

  # The only Docker API autoheal gets: the two calls its script makes —
  # GET /containers/json (list unhealthy, labelled containers) and
  # POST /containers/<id>/restart. Everything else is refused (403/405);
  # refusals are logged at WARN, so `docker logs onionpress-autoheal-proxy`
  # shows it if a future autoheal starts calling something new.
  #
  # Runs as root because the socket's owner is root in the Colima VM and
  # the user (root in its namespace) under rootless Docker, with no group
  # we could name portably — but with every capability dropped, a
  # read-only filesystem and no network. Pinned by multi-arch index digest
  # like every image here, from build/image-pins.env; bump with
  # build/refresh-image-digests.sh --socket-proxy <ref> (docs/BUILDING.md).
  autoheal-proxy:
    image: ghcr.io/wollomatic/socket-proxy:1.13.1@sha256:e78e68ba3ea4a6bf8ee47865ac1d1f98d525c3660df948554e766283c40d3f4b
    container_name: onionpress-autoheal-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - -socketpath=/var/run/docker.sock
      - -proxysocketendpoint=/run/autoheal-proxy/docker.sock
      - '-allowGET=(/v1\.[0-9]+)?/containers/json'
      - '-allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/restart'
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - autoheal-proxy:/run/autoheal-proxy
    restart: unless-stopped

  # The OnionHeaven farm controller: the one Tor-side container with the
  # Docker socket. The onionheaven service's heartbeat used to mount the
  # socket itself to create and drive the takeover workers; a compromised
  # heartbeat could then `docker run -v /:/x` (the socket is root on the
  # Colima VM, the user's own account under rootless Docker). Now the
  # heartbeat asks this process over a unix socket on the
  # onionpress-onionheaven-farm volume, which only the two mount, and the
  # process knows six verbs with validated arguments: spawn a worker (a
  # fixed `docker run` of the image below), remove, list and inspect
  # workers, run one of a fixed set of commands inside one, and read the
  # site's onion address from onionpress-tor (onionheaven-farm.py says what
  # exactly). Nothing in a request chooses an image, a mount, a
  # capability or a command line.
  #
  # Same image as the rest of the Tor side (entrypoint mode
  # FARM_CONTROLLER=1), no network, every capability dropped, a read-only
  # root filesystem: it runs the docker CLI as root, the socket's owner in
  # the VM and the user's uid under rootless Docker, and nothing else
  # (python3 writes nothing; /tmp is a tmpfs for the CLI's own temp files).
  # NO_ONION_SERVICE=1 is for an
  # older image that does not know FARM_CONTROLLER: it then idles as a
  # SOCKS-only Tor with no network instead of trying to be the site's Tor.
  # Refusals and every request are logged (`docker logs onionheaven-farm`).
  onionheaven-farm:
    image: ${ONIONHEAVEN_IMAGE:-${ONIONPRESS_TOR_IMAGE:-ghcr.io/brewsterkahle/onionpress-tor:latest@sha256:7035842f4aab419948febd7f64c287f937e0a2cb2bbd5ec1a32d42269081d7e7}}
    container_name: onionheaven-farm
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - FARM_CONTROLLER=1
      - NO_ONION_SERVICE=1
      # Takeover workers run this, the same reference as `image:` above —
      # never a floating tag (onionheaven-farm.py's takeover_image).
      - ONIONHEAVEN_IMAGE=${ONIONHEAVEN_IMAGE:-${ONIONPRESS_TOR_IMAGE:-ghcr.io/brewsterkahle/onionpress-tor:latest@sha256:7035842f4aab419948febd7f64c287f937e0a2cb2bbd5ec1a32d42269081d7e7}}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - onionheaven-farm:/run/onionheaven-farm
    tmpfs:
      - /tmp
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  onionheaven:
    image: ${ONIONHEAVEN_IMAGE:-${ONIONPRESS_TOR_IMAGE:-ghcr.io/brewsterkahle/onionpress-tor:latest@sha256:7035842f4aab419948febd7f64c287f937e0a2cb2bbd5ec1a32d42269081d7e7}}
    container_name: onionheaven
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    environment:
      - TZ=${TZ:-UTC}
      - NO_ONION_SERVICE=1
      - ONIONHEAVEN=1
      - ONIONHEAVEN_ACCEPT_REGISTRATIONS=${ONIONHEAVEN_ACCEPT_REGISTRATIONS:-}
      - ONIONPRESS_VERSION=${ONIONPRESS_VERSION:-unknown}
      - TOR_PROPAGATION_DELAY=${ONIONHEAVEN_PROPAGATION_DELAY:-180}
      - ONIONHEAVEN_TAKEOVER_SCALE_THRESHOLD=${ONIONHEAVEN_MAX_SERVICES:-50}
    # No Docker socket: its heartbeat monitor creates, inspects, execs into
    # and removes the takeover worker containers through onionheaven-farm
    # above, over the socket on the onionheaven-farm volume. It hosts no
    # onion service. See docs/DOCKER-SOCKET.md.
    volumes:
      - onionpress-data:/var/lib/onionpress
      - onionheaven-data:/var/lib/onionheaven
      - onionheaven-farm:/run/onionheaven-farm
    depends_on:
      - onionheaven-farm
    restart: unless-stopped
    # Starts Tor with su (SETGID, SETUID). DAC_OVERRIDE: the data migration
    # reads and clears the old location in /var/lib/onionpress (www-data's,
    # 0750; without it a first move with keys at stake refuses to start), and
    # the watchdog and the tor-manager read the control cookie in
    # debian-tor's /var/lib/tor. /var/lib/tor comes from the image, already
    # debian-tor's and private, so the entrypoint's chown -R and chmod 700 of
    # it change nothing: no CHOWN or FOWNER (the chmod logs "Operation not
    # permitted" and Tor starts). The Docker socket needs no capability: it
    # is root's (the user's under rootless Docker), and so is this process.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - onionpress-network
      - wordpress-network
    # wordpress-network: WordPress's bulk fetches (core updates, the Wayback
    # and social importers) use this container's SOCKS port, 9050.

volumes:
  onion-keys:
    name: onionpress-onion-keys
  tor-state:
    name: onionpress-tor-state
  wordpress-data:
    name: onionpress-wordpress-data
  db-data:
    name: onionpress-db-data
  onionpress-data:
    name: onionpress-persistent-data
  # The OnionHeaven hub data: the registry and the onion service key of
  # every site registered with this hub. Mounted at /var/lib/onionheaven by
  # tor, onionheaven and the takeover workers (onionheaven_common starts
  # them with it) and by nothing else, never wordpress. It used to be
  # onionheaven/ on onionpress-data; the tor image's entrypoint moves it
  # here (docs/DOCKER-SOCKET.md, "The OnionHeaven hub data").
  onionheaven-data:
    name: onionpress-onionheaven-data
  # OnionHome's onionname registry (onionnames.db: which name points at which
  # onion address). Mounted at /var/lib/onionnames by tor alone, never
  # wordpress: web-server.py is its only reader and writer. It used to be
  # onionhome/ on onionpress-data; the tor image's entrypoint moves it here
  # (docs/DOCKER-SOCKET.md, "The OnionHome name registry").
  onionnames-data:
    name: onionpress-onionnames-data
  # Holds nothing but autoheal-proxy's listening socket.
  autoheal-proxy:
    name: onionpress-autoheal-proxy
  # Holds nothing but the farm controller's listening socket (farm.sock),
  # for onionheaven's heartbeat.
  onionheaven-farm:
    name: onionpress-onionheaven-farm

networks:
  # The Tor side: tor, onionheaven, cloudflared and the takeover workers
  # (which onionheaven starts with `--network onionpress-network`). Their
  # way to the internet, and nothing else: they need public Tor relays and
  # Cloudflare's edge, never the publisher's LAN, the Docker host's own
  # services or (through the Colima VM's gateway, which Lima maps to the
  # Mac's 127.0.0.1) anything on the Mac's loopback. The launchers put the
  # ONIONPRESS-TOR chain on the Docker host with WordPress's (onionpress/
  # wordpress_egress.py): from this bridge, the host itself and private,
  # link-local, CGNAT, loopback and multicast addresses are refused (logged
  # as CLEARNET-local-blocked), except replies and DNS; the internet is not.
  # The bridge has a fixed name for the same reason as onionpress-wp0. Docker
  # cannot rename one: the launchers recreate a network made before, on
  # Docker's br-<id> (migrate_tor_network), before the first `compose up`.
  onionpress-network:
    name: onionpress-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: onionpress-tor0
  # WordPress and MariaDB, and nothing out of it but Tor (issue #144).
  # tor, onionheaven and cloudflared join it to reach wordpress:80 and to
  # serve WordPress their SOCKS ports; no takeover worker does.
  #
  # The launchers put the ONIONPRESS-WP chain on the Docker host before any
  # `compose up` (onionpress/wordpress_egress.py): a packet that comes in
  # from this bridge and either leaves it or is for the host itself is
  # refused (and logged as CLEARNET-blocked) unless it answers a connection
  # made from outside: a browser through the published port, docker-proxy's
  # connection, the host's own. So the published port, LAN visitors on
  # Linux (their own addresses, not the gateway's) and everything between
  # these containers work as before, and WordPress, MariaDB or a plugin
  # opening a socket to the internet, the LAN or the host gets an error.
  # The rules name the bridge, which is why it has a fixed name: they are in
  # place before Docker creates it, and in the Colima VM a docker.service
  # drop-in reinstalls them before Docker restarts anything after a boot.
  #
  # Not `internal: true`: an internal network publishes no ports and gives
  # WordPress no default route, so neither the published port nor the
  # gateway auto-login and /__op_proxy.php trust would exist.
  #
  # Its name must sort after onionpress-network. A container on two
  # networks takes its default route from the first in lexical order
  # (Docker's tie-break; there is no other preference between two plain
  # IPv4 bridges), so tor, onionheaven and cloudflared keep reaching the
  # internet. IPv6 stays off for the same reason (a dual-stack network
  # would win) and because the chain's IPv6 half is best effort.
  wordpress-network:
    name: onionpress-wordpress-network
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: onionpress-wp0
