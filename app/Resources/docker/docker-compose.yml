services:
  tor:
    image: ghcr.io/brewsterkahle/onionpress-tor:latest@sha256:ecab8ad6c9a196b308441f1eac787504d8c43fb6ad7638363edb14a41e784e2b
    container_name: onionpress-tor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    environment:
      - TZ=${TZ:-UTC}
      - TOR_IMPL=${TOR_IMPL:-tor}
      - ONIONPRESS_VERSION=${ONIONPRESS_VERSION:-unknown}
    volumes:
      - arti-state:/var/lib/arti/
      - tor-state:/var/lib/tor/
      - onionpress-data:/var/lib/onionpress
      - ${ONIONPRESS_SHARED_DIR:-/tmp/onionpress-no-shared}/analytics:/var/lib/onionhome/analytics
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      - wordpress
    restart: unless-stopped
    networks:
      - onionpress-network
    ports:
      - "${ONIONPRESS_BIND_HOST:-127.0.0.1}:${ONIONPRESS_SOCKS_PORT:-9050}:9050"

  wordpress:
    image: ghcr.io/brewsterkahle/onionpress-wordpress:latest@sha256:5056497e355667c6f440baf75721e189c7845921218468f566d34e20c39bc776
    container_name: onionpress-wordpress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_DB_NAME=wordpress
      # Only request-derived constants belong here (they need $_SERVER). Static
      # constants live in wp-config.php's custom-values block — keeping both in
      # sync would cause duplicate-define warnings on every request.
      - WORDPRESS_CONFIG_EXTRA=
          $$scheme = 'http';
          if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') $$scheme = 'https';
          define('WP_HOME', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
          define('WP_SITEURL', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
          define('FORCE_SSL_ADMIN', false);
          define('COOKIE_DOMAIN', preg_replace('/:\d+$$/', '', $$_SERVER['HTTP_HOST']));
    # Healthcheck + autoheal label: if Apache wedges (the 2026-04-23 incident
    # pattern — worker pool saturated, requests queuing past timeout), the
    # autoheal sidecar restarts this container automatically. /wp-login.php
    # is a lightweight, always-available endpoint; the previous /wp-cron.php
    # could itself be slow under load.
    #
    # Tuning is deliberately conservative: OnionPress runs on laptops that
    # sleep/wake, so short-lived unreachability after resume is normal.
    # 60s interval × 15 retries ≈ 15 min of sustained failure before restart.
    # The 2026-04-23 outage was 3h45m; 15-min self-heal is a huge improvement
    # without misfiring on wake transients.
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "10", "http://localhost/wp-login.php"]
      interval: 60s
      timeout: 15s
      retries: 15
      start_period: 300s
    labels:
      - autoheal=true
    volumes:
      - wordpress-data:/var/www/html
      - onionpress-data:/var/lib/onionpress
      - ${ONIONPRESS_DOCUMENTS_DIR:-/tmp/onionpress-no-docs}/Creations/My Creations:/var/www/html/wp-content/creations:rw
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - onionpress-network
    ports:
      - "${ONIONPRESS_BIND_HOST:-127.0.0.1}:${ONIONPRESS_WP_PORT:-8080}:80"

  db:
    image: mariadb:latest
    container_name: onionpress-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - onionpress-network

  # Auto-restart any container labeled autoheal=true when its HEALTHCHECK
  # reports unhealthy. Prevents wedge-until-manual-reboot scenarios like
  # the 2026-04-23 incident. Polling interval is 60s so autoheal itself
  # doesn't thrash; the actual decision to restart is governed by the
  # target container's healthcheck retries (conservative — see wordpress
  # service above for the ~15-minute sustained-failure threshold).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: onionpress-autoheal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=0
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped

  onionheaven:
    image: ${ONIONHEAVEN_IMAGE:-ghcr.io/brewsterkahle/onionpress-tor:latest@sha256:ecab8ad6c9a196b308441f1eac787504d8c43fb6ad7638363edb14a41e784e2b}
    container_name: onionheaven
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    environment:
      - TZ=${TZ:-UTC}
      - TOR_IMPL=${TOR_IMPL:-tor}
      - NO_ONION_SERVICE=1
      - ONIONHEAVEN=1
      - ONIONPRESS_VERSION=${ONIONPRESS_VERSION:-unknown}
      - TOR_PROPAGATION_DELAY=${ONIONHEAVEN_PROPAGATION_DELAY:-180}
      - ONIONHEAVEN_TAKEOVER_SCALE_THRESHOLD=${ONIONHEAVEN_MAX_SERVICES:-50}
    volumes:
      - arti-state-polling:/var/lib/arti/
      - onionpress-data:/var/lib/onionpress
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - onionpress-network

volumes:
  arti-state:
    name: onionpress-arti-state
  tor-state:
    name: onionpress-tor-state
  arti-state-polling:
    name: onionpress-arti-state-polling
  wordpress-data:
    name: onionpress-wordpress-data
  db-data:
    name: onionpress-db-data
  onionpress-data:
    name: onionpress-persistent-data

networks:
  onionpress-network:
    name: onionpress-network
    driver: bridge
