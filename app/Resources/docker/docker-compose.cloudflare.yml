services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    container_name: onionpress-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # No capability at all (docker-compose.yml's header says why every
    # service drops NET_RAW): the image runs as an unprivileged user (65532)
    # with no file capabilities, so it holds none of Docker's defaults to
    # begin with; this empties the bounding set too. It only dials out (TCP
    # and QUIC) and binds no low port.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - onionpress-network
    depends_on:
      - wordpress
    restart: unless-stopped

networks:
  onionpress-network:
    name: onionpress-network
    driver: bridge
