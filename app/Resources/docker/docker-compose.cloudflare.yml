services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: onionpress-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # No capability at all (docker-compose.yml's header says why every
    # service drops them all): the image runs as an unprivileged user (65532)
    # with no file capabilities, so it holds none of Docker's defaults to
    # begin with; this empties the bounding set too. It only dials out (TCP
    # and QUIC) and binds no low port.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - onionpress-network
      - wordpress-network
    # onionpress-network to Cloudflare, wordpress-network to wordpress:80
    # (docker-compose.yml says why they are two).
    depends_on:
      - wordpress
    restart: unless-stopped

networks:
  # Both as in docker-compose.yml.
  onionpress-network:
    name: onionpress-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: onionpress-tor0
  wordpress-network:
    name: onionpress-wordpress-network
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: onionpress-wp0
